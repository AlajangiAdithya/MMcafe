[build]
  command = "npm run build"
  publish = "dist"

# SPA: redirect all routes to index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# ===== CACHE HEADERS =====
# Hashed Vite build assets (JS/CSS chunks) — never change once shipped, so we
# can cache forever and let the next deploy bust them via the new filename hash.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Static images / icons in /public — change rarely, cache for a day in the
# browser and a year on the CDN with stale-while-revalidate so the site stays
# fast even when an asset is updated.
[[headers]]
  for = "/logo.png"
  [headers.values]
    Cache-Control = "public, max-age=86400, s-maxage=31536000, stale-while-revalidate=86400"

[[headers]]
  for = "/favicon.svg"
  [headers.values]
    Cache-Control = "public, max-age=86400, s-maxage=31536000, stale-while-revalidate=86400"

[[headers]]
  for = "/icons.svg"
  [headers.values]
    Cache-Control = "public, max-age=86400, s-maxage=31536000, stale-while-revalidate=86400"

# index.html must NEVER be cached at the browser, otherwise users will keep
# loading old chunks after a deploy. Netlify's CDN can hold it briefly.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# ===== SECURITY HEADERS (apply to every response) =====
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=(), payment=(self \"https://checkout.razorpay.com\" \"https://api.razorpay.com\")"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    X-XSS-Protection = "1; mode=block"
    Cross-Origin-Opener-Policy = "same-origin-allow-popups"
